name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: check-agpl
        run: make check-agpl
      - name: check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for got in "$(jq -r .version manifest.json)" "$(jq -r .version server.json)" \
            "$(jq -r '.packages[0].identifier | sub(".*:"; "")' server.json)"; do
            if [ "$got" != "$version" ]; then
              echo "::error::manifest.json and server.json must carry version ${version}, found ${got}."
              exit 1
            fi
          done
          scripts/release-notes.sh "$version" >/dev/null

  binaries:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - name: release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt

  image:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      # --recursive also signs each platform manifest, which is what a pull resolves to.
      - name: sign image
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM per platform
        run: |
          for arch in amd64 arm64; do
            platform_digest=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
              jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            sbom="fusescope-mcp-server_image_linux_${arch}.spdx.json"
            syft scan "registry:${IMAGE}@${platform_digest}" -o "spdx-json=${sbom}"
            cosign attest --yes --type spdxjson --predicate "$sbom" "${IMAGE}@${platform_digest}"
          done
          gh release upload "$TAG" fusescope-mcp-server_image_linux_*.spdx.json --clobber
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
