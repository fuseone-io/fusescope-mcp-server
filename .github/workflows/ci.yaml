name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, check-deps, check-agpl, check-release-tag, check-build, test-race]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run make ${{ matrix.check }}
        run: make ${{ matrix.check }}

  e2e-style:
    name: e2e-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      - name: Check e2e Python style
        run: make check-e2e-style
