name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, check-deps, check-agpl, check-release-tag, check-build, test-race]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run make ${{ matrix.check }}
        run: make ${{ matrix.check }}

  e2e-style:
    name: e2e-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"

      - name: Check e2e Python style
        run: make check-e2e-style
