name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, check-deps, check-build, test-race]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run make ${{ matrix.check }}
        run: make ${{ matrix.check }}

  e2e-style:
    name: e2e-style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check e2e Python style
        run: make check-e2e-style
