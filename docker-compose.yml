services:
  fusescope-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fusescope-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    environment:
      - FUSESCOPE_URL=${FUSESCOPE_URL}
      - FUSESCOPE_API_KEY=${FUSESCOPE_API_KEY}
      - TRANSPORT_MODE=http
      - MCP_SERVER_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - fusescope-mcp-network
    labels:
      - "io.fuseone.service=fusescope-mcp-server"
      - "io.fuseone.description=FuseScope MCP Server for AI assistants"

networks:
  fusescope-mcp-network:
    driver: bridge
