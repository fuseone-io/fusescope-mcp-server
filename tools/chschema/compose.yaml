name: fusescope-mcp-chschema

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.12.5}
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/fusescope.xml:ro
    ports:
      - "127.0.0.1::8123"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrator:
    image: ghcr.io/fuseone-io/fusescope-schema-migrator:${SCHEMA_MIGRATOR_VERSION:?set SCHEMA_MIGRATOR_VERSION}
    profiles: [migrate]
