# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: fusescope-mcp-server

before:
  hooks:
    - go mod tidy

builds:
  - id: fusescope
    binary: bin/fusescope-mcp-server
    main: ./cmd/server/
    ldflags:
      - -s -w -X github.com/fuseone-io/fusescope-mcp-server/pkg/version.Version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{- .Os }}_{{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
    strip_binary_directory: false
    files:
      - src: README.md
        dst: README.md
      - src: LICENSE
        dst: LICENSE
      - src: NOTICE
        dst: NOTICE

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  disable: true

release:
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
